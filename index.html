<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WallpaperLK 🔥 - 4K HD Wallpapers</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header>
  <div class="logo">WallpaperLK <span>🔥</span></div>
  <div class="search-box">
    <input type="text" id="search" placeholder="Search Cars, Anime, Nature...">
    <button onclick="searchWall()">🔍</button>
  </div>
</header>

<!-- 📤 UPLOAD BUTTON - SEARCH YATA HARI THANA -->
<div style="text-align:center;padding:12px 0;background:#0f0f0f;">
  <label style="background:linear-gradient(90deg,#6c5ce7,#a29bfe);color:white;padding:10px 20px;border-radius:25px;cursor:pointer;font-weight:bold;display:inline-block;box-shadow:0 4px 10px rgba(108,92,231,0.3)">
    📤 Upload Your Photos
    <input type="file" multiple accept="image/*" style="display:none" onchange="uploadWallpapers(this)">
  </label>
  <p style="font-size:11px;color:#888;margin-top:6px">Oya phone eke anime photos upload karanna!</p>
</div>

<nav style="display:flex;gap:8px;overflow-x:auto;padding:10px;background:#0f0f0f;position:sticky;top:0;z-index:10">
  <button onclick="filterCat('all')" class="active">All 🔥</button>
  <button onclick="filterCat('car')">Cars 🚗</button>
  <button onclick="filterCat('anime')">Anime 🌸</button>
  <button onclick="filterCat('nature')">Nature 🏔️</button>
  <button onclick="filterCat('aesthetic')">Aesthetic 💜</button>
  <button onclick="filterCat('dark')">Dark 🖤</button>
</nav>

<div id="gallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;padding:10px"></div>
<div id="loader" style="text-align:center;padding:20px;color:#888">🔥 Loading wallpapers...</div>

<div id="modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:100;justify-content:center;align-items:center;flex-direction:column">
  <span onclick="closeModal()" style="position:absolute;top:20px;right:20px;color:white;font-size:30px;cursor:pointer">✕</span>
  <img id="modal-img" style="max-width:95%;max-height:80%;border-radius:12px">
  <p class="stats">👁 <span id="views">1.2k</span> &nbsp; ❤️ <span id="likes">234</span> &nbsp; ⬇️ <span id="downs">890</span></p>
  <a id="download-btn" href="" target="_blank" style="background:#6c5ce7;color:white;padding:10px 20px;border-radius:20px;text-decoration:none;margin:5px">⬇️ Download Original</a>
  <a id="download-wm-btn" href="#" onclick="downloadWithWatermark(event)" style="background:#00b894;color:white;padding:10px 20px;border-radius:20px;text-decoration:none;margin:5px">⬇️ Download with Watermark</a>
  <div class="small-btns" style="display:flex;gap:10px;margin-top:10px">
    <button onclick="shareWall()" style="padding:8px 14px;border-radius:15px;border:none">📤 Share</button>
    <button onclick="likeWall()" style="padding:8px 14px;border-radius:15px;border:none">❤️ Like</button>
  </div>
</div>

<canvas id="wm-canvas" style="display:none"></canvas>
<footer style="text-align:center;padding:20px;color:#666">© 2026 WallpaperLK.lk | Made in SL 🇱🇰</footer>
<script src="script.js"></script>
</body>
  </html>
